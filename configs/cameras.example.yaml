# Example configuration for Railway Perimeter Intrusion Detection Demo
# Copy this file to cameras.yaml and customize RTSP/FTP paths.

system:
  analysis_mode: "video"                       # video | image
  save_annotated_images: true
  base_cache_dir: "./data/cache"
  base_video_dir: "./data/video"
  db_path: "./data/db/events.db"
  log_dir: "./data/logs"
  ffmpeg_path: "ffmpeg"
  log_level: "INFO"
  scheduler_interval_sec: 1.0
  file_cleanup_interval_sec: 30.0
  enable_api: true
  api_host: "0.0.0.0"
  api_port: 8000

cameras:
  cam_001:
    name: "Railway Perimeter Camera 001"
    ip: "192.168.1.100"
    rtsp_url: "rtsp://admin:password@192.168.1.100:554/Streaming/Channels/101"
    ftp_image_dir: "./data/ftp/cam_001"
    event_type: "intrusion"
    enabled: true
    pre_seconds: 5
    post_seconds: 10
    cache_seconds: 120
    cooldown_seconds: 3
    max_extend_seconds: 60
    output_dir: "./data/video/cam_001"

    railway_security:
      enabled: true
      scene_type: "railway_perimeter"
      yolo:
        enabled: true
        model_path: "yolov8n.pt"
        conf_threshold: 0.35
        target_classes:
          - person
          - car
          - truck
          - bus
          - motorcycle
          - bicycle
          - dog
          - cat
          - horse
          - cow
          - sheep
      regions:
        image_size: [1920, 1080]
        fence_line:
          - [100, 620]
          - [1800, 610]
        warning_zone:
          - [80, 500]
          - [1850, 500]
          - [1900, 760]
          - [60, 760]
        danger_zone:
          - [150, 620]
          - [1800, 620]
          - [1860, 900]
          - [120, 900]
      risk_rules:
        min_persist_frames: 2
        low_risk: "目标在警戒区外经过"
        medium_risk: "目标靠近护网或进入警戒区"
        high_risk: "目标越过护网、进入危险区或向轨道方向移动"
      vlm:
        enabled: true
        provider: "dashscope"
        model: "qwen-vl-plus"
        timeout_sec: 20
        mock_when_no_key: true
