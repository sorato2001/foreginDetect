detector: yolo11_railway
yolo_model_path: weights/yolo11l.pt
conf_threshold: 0.25
tracker: sam_tracking
sam_tracking:
  enabled: true
  object_model_path: "weights/yolo11l.pt"
  track_model_path: "weights/best.pt"
  sam2_config: "sam2_hiera_l.yaml"
  sam2_checkpoint: "weights/sam2_hiera_large.pt"
  device: "cuda"
  target_labels:
    - person
    - cow
    - sheep
  iou_threshold: 0.10
  object_overlap_threshold: 0.15
  window_size: 5
  confirm_count: 3
  use_optical_flow: true
  fallback_to_bbox_mask: true
  sam2_enabled: true
  sam2_scan_frames: 30
  sam2_prompt_mode: "bounding_box"
  sam2_new_object_iou_threshold: 0.3
  sample_every: 15
  track_mask_interval: 30
  imgsz: 640
vlm_provider: mock
qwen_model: qwen-vl-plus
dashscope_api_key_env: DASHSCOPE_API_KEY
timeout_sec: 60
vlm:
  provider: qwen
  timeout_seconds: 60
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  max_retries: 2
  retry_backoff_seconds: 2
  fallback_on_error: true
